
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links in HTML</title>
</head>
<body>

    <h1>Links in HTML</h1>

    <p>
        Links are an essential part of web content.
        They allow us to navigate from one webpage to another.
    </p>

    <!-- External Links -->

    <a href="https://www.google.com" target="_blank">Visit Google</a><br><br>

    <a href="https://www.facebook.com" target="_blank">Visit Facebook</a><br><br>

    <a href="https://www.twitter.com" target="_blank">Visit Twitter</a><br><br>

    <a href="https://www.instagram.com" target="_blank">Visit Instagram</a><br><br>

    <a href="https://www.linkedin.com" target="_blank">Visit LinkedIn</a><br><br>

    <!-- Internal Links -->

    <h2>Internal Links</h2>

    <a href="images.html">View Images</a><br><br>

    <a href="heading.html">View Headings</a><br><br>

    <a href="paragraph.html">View Paragraphs</a><br><br>

    <a href="intro.html">View Introduction</a><br><br>
    <a href="images.html" target="_blank">
        <button type="button">View Images</button>
    </a>

    <a href="images.html">
        <img src="static/images/environment.jpg"
             alt="View Images"
             width="300"
             height="200">
    </a>

</body>
</html>
