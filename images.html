
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images in HTML</title>
</head>
<body>

    <h1>Images in HTML</h1>

    <p>
        Images are an essential part of web content.
        They can enhance the presentation of information to users.
    </p>

    <img src="images/environment.jpg" alt="Environment" width="300" height="200">

    <img src="images/fruits.jpg" alt="Fruits" width="300" height="200">

    <img src="images/horse.jpg" alt="Horse" width="300" height="200">

    <img src="images/lake.jpg" alt="Lake" width="300" height="200">

    <img src="images/puppy.jpg" alt="Puppy" width="300" height="200">

</body>
</html>
